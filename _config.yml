# Milo 主题默认配置
# 界面语言在站点根目录的 _config.yml 设置。支持 zh-CN 和 en，默认 zh-CN，
# 指定的语言均不受支持时回退到 en。
uiux:
  slogan: ''
  primary_color: null
  link_color: null
  bg_color: null
img:
  avatar: ''
  responsive: {}
head:
  favicon:
    ico: ''
footer:
  custom_text: null
  copyright_since: 0
search:
  enable: true
toc:
  enable: true
comment:
  disqus:
    shortname: ''

# 分享图：完整 URL 或站内路径，回退到头像及内置 PNG。
seo:
  image: ''
# 内置 Atom 订阅；站点已有 Feed 生成器优先。
feed:
  enable: true
  limit: 20

# 可选文章灯箱；文章可用 lightbox: false 单独禁用。
reading:
  progress: true
  lightbox: false

# 双栏布局吸附最近文章与分类区域。
sidebar:
  sticky: true

# 留空使用内置导航；自定义时按填写顺序显示，标签可自由命名。
menu: null
# 可选作者链接。支持 github、email、rss、website 及自定义平台名。
# rss: true 使用站点现有订阅地址。
social: {}
